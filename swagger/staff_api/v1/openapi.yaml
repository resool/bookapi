---
openapi: 3.0.1
info:
  title: Library Staff API
  version: v1
paths:
  "/staff-api/v1/books":
    post:
      summary: Add a new book (title, authors, first copy)
      tags:
      - Books
      description: Creates the work, its authors (matched by name) and the edition,
        then the first copy with a generated SKU. To add another copy of a book the
        library already has, use POST /staff-api/v1/editions/{edition_id}/books.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Send the same key when retrying a request; a repeated key replays
          the first response instead of creating another book.
      responses:
        '201':
          description: book created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/book"
        '422':
          description: invalid params
          content:
            application/json:
              examples:
                authors_missing:
                  value:
                    errors:
                    - code: authors_missing
                      message: At least one author is required
                edition_already_exists:
                  value:
                    errors:
                    - code: edition_already_exists
                      message: Edition with ISBN 9780575048003 already exists; add
                        a copy with POST /staff-api/v1/editions/:edition_id/books
                title_missing:
                  value:
                    errors:
                    - code: validation_failed
                      message: Title can't be blank
              schema:
                "$ref": "#/components/schemas/errors_object"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - authors
              - condition
              properties:
                title:
                  type: string
                  example: Good Omens
                authors:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  example:
                  - Terry Pratchett
                  - Neil Gaiman
                condition:
                  type: string
                  example: new
                description:
                  type: string
                  example: The apocalypse, but funny.
                publisher:
                  type: string
                  example: Gollancz
                published_year:
                  type: integer
                  example: 1990
                isbn:
                  type: string
                  example: 978-0-575-04800-3
                translator:
                  type: string
    get:
      summary: List books with their status
      tags:
      - Books
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: books listed
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/book"
                  meta:
                    "$ref": "#/components/schemas/pagination_meta"
  "/staff-api/v1/books/{sku}":
    delete:
      summary: Withdraw a book copy (soft delete)
      tags:
      - Books
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: book withdrawn
        '409':
          description: book is currently loaned
          content:
            application/json:
              examples:
                book_loaned:
                  value:
                    errors:
                    - code: book_loaned
                      message: Book 000123 is currently loaned and cannot be withdrawn
              schema:
                "$ref": "#/components/schemas/errors_object"
        '404':
          description: book not found
          content:
            application/json:
              examples:
                book_not_found:
                  value:
                    errors:
                    - code: book_not_found
                      message: Book not found
              schema:
                "$ref": "#/components/schemas/errors_object"
    get:
      summary: Show a book with its full loan history
      tags:
      - Books
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: book with loan history
          content:
            application/json:
              examples:
                currently_loaned:
                  value:
                    data:
                      sku: '000123'
                      condition: good
                      title: Anne of Green Gables
                      description: An orphan girl is mistakenly sent to live with
                        an elderly brother and sister on Prince Edward Island.
                      authors:
                      - Lucy Maud Montgomery
                      status: loaned
                      loans:
                      - rented_at: '2026-10-01T10:15:00Z'
                        due_at: '2026-10-31T10:15:00Z'
                        returned_at:
                        member:
                          member_number: '000108'
                          name: Maria Wiśniewska
                          email: maria.w@example.com
                      - rented_at: '2026-08-11T12:00:00Z'
                        due_at: '2026-09-10T12:00:00Z'
                        returned_at: '2026-09-14T10:20:00Z'
                        member:
                          member_number: '000042'
                          name: Jan Kowalski
                          email: jan.kowalski@example.com
                      - rented_at: '2026-06-02T09:30:00Z'
                        due_at: '2026-07-02T09:30:00Z'
                        returned_at: '2026-06-14T17:05:00Z'
                        member:
                          member_number: '000017'
                          name: Anna Nowak
                          email: anna.nowak@example.com
                available:
                  value:
                    data:
                      sku: '000123'
                      condition: good
                      title: Anne of Green Gables
                      description: An orphan girl is mistakenly sent to live with
                        an elderly brother and sister on Prince Edward Island.
                      authors:
                      - Lucy Maud Montgomery
                      status: available
                      loans:
                      - rented_at: '2026-08-11T12:00:00Z'
                        due_at: '2026-09-10T12:00:00Z'
                        returned_at: '2026-09-14T10:20:00Z'
                        member:
                          member_number: '000042'
                          name: Jan Kowalski
                          email: jan.kowalski@example.com
                      - rented_at: '2026-06-02T09:30:00Z'
                        due_at: '2026-07-02T09:30:00Z'
                        returned_at: '2026-06-14T17:05:00Z'
                        member:
                          member_number: '000017'
                          name: Anna Nowak
                          email: anna.nowak@example.com
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/book_with_loans"
        '404':
          description: book not found
          content:
            application/json:
              examples:
                book_not_found:
                  value:
                    errors:
                    - code: book_not_found
                      message: Book not found
              schema:
                "$ref": "#/components/schemas/errors_object"
  "/staff-api/v1/books/{sku}/loans":
    post:
      summary: Borrow a book
      tags:
      - Loans
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: book borrowed
          content:
            application/json:
              examples:
                borrowed:
                  value:
                    data:
                      rented_at: '2026-10-01T10:15:00Z'
                      due_at: '2026-10-31T10:15:00Z'
                      returned_at:
                      member:
                        member_number: '000042'
                        name: Jan Kowalski
                        email: jan.kowalski@example.com
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/loan"
        '404':
          description: book not found
          content:
            application/json:
              examples:
                book_not_found:
                  value:
                    errors:
                    - code: book_not_found
                      message: Book not found
              schema:
                "$ref": "#/components/schemas/errors_object"
        '409':
          description: book not available
          content:
            application/json:
              examples:
                book_loaned:
                  value:
                    errors:
                    - code: book_not_available
                      message: Book 000123 is currently loaned
                book_in_repair:
                  value:
                    errors:
                    - code: book_not_available
                      message: Book 000123 is in repair
              schema:
                "$ref": "#/components/schemas/errors_object"
        '422':
          description: member cannot borrow
          content:
            application/json:
              examples:
                member_not_found:
                  value:
                    errors:
                    - code: member_not_found
                      message: Member with card number 000042 not found
                member_suspended:
                  value:
                    errors:
                    - code: member_suspended
                      message: Member 000042 is suspended
                member_has_overdue_loans:
                  value:
                    errors:
                    - code: member_has_overdue_loans
                      message: Member 000042 has overdue loans
              schema:
                "$ref": "#/components/schemas/errors_object"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - member_number
              properties:
                member_number:
                  type: string
                  pattern: "^\\d{6}$"
                  example: '000042'
                  description: Library card number
  "/staff-api/v1/books/{sku}/return":
    post:
      summary: Return a borrowed book
      tags:
      - Loans
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: book returned
          content:
            application/json:
              examples:
                returned:
                  value:
                    data:
                      sku: '000123'
                      condition: good
                      status: available
                      title: Anne of Green Gables
                      description: An orphan girl is mistakenly sent to live with
                        an elderly brother and sister on Prince Edward Island.
                      authors:
                      - Lucy Maud Montgomery
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/book"
        '409':
          description: book is not loaned
          content:
            application/json:
              examples:
                book_not_loaned:
                  value:
                    errors:
                    - code: book_not_loaned
                      message: Book 000123 is not currently loaned
              schema:
                "$ref": "#/components/schemas/errors_object"
        '404':
          description: book not found
          content:
            application/json:
              examples:
                book_not_found:
                  value:
                    errors:
                    - code: book_not_found
                      message: Book not found
              schema:
                "$ref": "#/components/schemas/errors_object"
  "/staff-api/v1/editions/{edition_id}/books":
    post:
      summary: Add a book copy to an edition
      tags:
      - Books
      parameters:
      - name: edition_id
        in: path
        required: true
        schema:
          type: integer
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Send the same key when retrying a request; a repeated key replays
          the first response instead of creating another copy.
      responses:
        '201':
          description: book created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/book"
        '409':
          description: request with this Idempotency-Key is still being processed
          content:
            application/json:
              examples:
                request_in_progress:
                  value:
                    errors:
                    - code: request_in_progress
                      message: A request with this Idempotency-Key is still being
                        processed
              schema:
                "$ref": "#/components/schemas/errors_object"
        '404':
          description: edition not found
          content:
            application/json:
              examples:
                edition_not_found:
                  value:
                    errors:
                    - code: edition_not_found
                      message: Edition not found
              schema:
                "$ref": "#/components/schemas/errors_object"
        '422':
          description: invalid params
          content:
            application/json:
              examples:
                condition_missing:
                  value:
                    errors:
                    - code: validation_failed
                      message: Condition can't be blank
                idempotency_key_reused:
                  value:
                    errors:
                    - code: idempotency_key_reused
                      message: Idempotency-Key was already used with a different request
              schema:
                "$ref": "#/components/schemas/errors_object"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - condition
              properties:
                condition:
                  type: string
                  example: new
                acquired_on:
                  type: string
                  format: date
servers:
- url: http://localhost:3000
components:
  schemas:
    errors_object:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                example: book_not_available
              message:
                type: string
                example: Book 000123 is currently loaned
    pagination_meta:
      type: object
      required:
      - page
      - limit
      - count
      - pages
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        count:
          type: integer
          example: 42
          description: Total number of records
        pages:
          type: integer
          example: 3
    loan:
      type: object
      required:
      - rented_at
      - due_at
      - returned_at
      - member
      properties:
        rented_at:
          type: string
          format: date-time
          example: '2026-10-01T10:15:00Z'
        due_at:
          type: string
          format: date-time
          example: '2026-10-31T10:15:00Z'
        returned_at:
          type: string
          format: date-time
          nullable: true
          example:
        member:
          type: object
          required:
          - member_number
          - name
          - email
          properties:
            member_number:
              type: string
              pattern: "^\\d{6}$"
              example: '000042'
              description: Library card number
            name:
              type: string
              example: Jan Kowalski
            email:
              type: string
              format: email
              example: jan.kowalski@example.com
    book:
      type: object
      required:
      - sku
      - condition
      - status
      - title
      - description
      - authors
      properties:
        sku:
          type: string
          pattern: "^\\d{6}$"
          example: '000123'
        condition:
          type: string
          example: good
        status:
          type: string
          enum:
          - available
          - loaned
          - in_repair
          - lost
          - withdrawn
          example: available
        title:
          type: string
          example: Anne of Green Gables
        description:
          type: string
          nullable: true
          example: An orphan girl is mistakenly sent to live with an elderly brother
            and sister on Prince Edward Island.
        authors:
          type: array
          items:
            type: string
          example:
          - Lucy Maud Montgomery
    book_with_loans:
      type: object
      required:
      - sku
      - condition
      - status
      - title
      - description
      - authors
      - loans
      properties:
        sku:
          type: string
          pattern: "^\\d{6}$"
          example: '000123'
        condition:
          type: string
          example: good
        status:
          type: string
          enum:
          - available
          - loaned
          - in_repair
          - lost
          - withdrawn
          example: available
        title:
          type: string
          example: Anne of Green Gables
        description:
          type: string
          nullable: true
          example: An orphan girl is mistakenly sent to live with an elderly brother
            and sister on Prince Edward Island.
        authors:
          type: array
          items:
            type: string
          example:
          - Lucy Maud Montgomery
        loans:
          type: array
          items:
            "$ref": "#/components/schemas/loan"
