---
openapi: 3.0.1
info:
  title: Library Public API
  version: v1
paths:
  "/public-api/v1/books":
    get:
      summary: List books with availability
      tags:
      - Books
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: books listed
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/book"
                  meta:
                    "$ref": "#/components/schemas/pagination_meta"
servers:
- url: http://localhost:3000
components:
  schemas:
    pagination_meta:
      type: object
      required:
      - page
      - limit
      - count
      - pages
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        count:
          type: integer
          example: 42
          description: Total number of records
        pages:
          type: integer
          example: 3
    book:
      type: object
      required:
      - available
      - title
      - description
      - authors
      additionalProperties: false
      properties:
        available:
          type: boolean
          example: true
        title:
          type: string
          example: Anne of Green Gables
        description:
          type: string
          example: An orphan girl is mistakenly sent to live with an elderly brother
            and sister on Prince Edward Island.
        authors:
          type: array
          items:
            type: string
          example:
          - Lucy Maud Montgomery
