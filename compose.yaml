x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: bookapi-dev
  environment:
    DB_HOST: db
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
  volumes:
    - .:/rails

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    <<: *app
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/up"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  jobs:
    <<: *app
    command: bin/jobs
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
